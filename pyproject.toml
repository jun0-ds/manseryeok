[project]
name = "manseryeok"
version = "0.0.1-dev"
description = "한국식 만세력·사주 Python 라이브러리. 외부 의존성 0, 1900-2100 절기 데이터, 진태양시·조자시 표준."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "jun0-ds" },
]
keywords = ["saju", "manseryeok", "fortune", "korean", "ganzhi", "wuxing", "lunar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jun0-ds/manseryeok"
Repository = "https://github.com/jun0-ds/manseryeok"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manseryeok"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
